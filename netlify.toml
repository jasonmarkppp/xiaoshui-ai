[build]
  command = "npm run build"
  # Do NOT set publish to ".next" — that makes Netlify serve a static folder
  # (no index.html) and causes "Page not found". Next.js on Netlify uses the
  # OpenNext adapter and publishes through Functions + CDN automatically.

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
